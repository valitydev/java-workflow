name: Maven Deploy Artifact

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version'
        required: false
        default: "25"
        type: string
      java-distribution:
        description: 'Java distribution'
        required: false
        default: "temurin"
        type: string
      mvn-args:
        description: 'Additional maven args'
        required: false
        default: "-DskipTests"
        type: string
      ignore-coverage:
        description: 'Deprecated compatibility input; test coverage is no longer run'
        default: false
        required: false
        type: boolean
    secrets:
      github-token:
        required: true
      mm-webhook-url:
        required: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Run Build Java
        uses: valitydev/action-jdk-build@v0.0.17
        with:
          jdk-version: ${{ inputs.java-version }}
          jdk-distribution: ${{ inputs.java-distribution }}
          mvn-args: ${{ inputs.mvn-args }}

      - name: Deploy image
        uses: valitydev/action-deploy-docker@v2.0.19
        with:
          registry-username: ${{ github.actor }}
          registry-access-token: ${{ secrets.github-token }}
          context-path: "./target"
          dockerfile-path: "./target/Dockerfile"
